<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="Google Partner">
  <!-- Badge fondo -->
  <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  <!-- Logo Google con colores oficiales -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="18">
    <text x="14" y="26" fill="#4285F4">G</text>
    <text x="26" y="26" fill="#EA4335">o</text>
    <text x="38" y="26" fill="#FBBC05">o</text>
    <text x="50" y="26" fill="#4285F4">g</text>
    <text x="62" y="26" fill="#34A853">l</text>
    <text x="68" y="26" fill="#EA4335">e</text>
  </g>
  <!-- Etiqueta "Partner" -->
  <text x="14" y="46" font-family="Arial, sans-serif" font-weight="500" font-size="14" fill="#5f6368">Partner</text>
  <!-- Check verde -->
  <circle cx="170" cy="30" r="14" fill="#34A853"/>
  <path d="M163 30 l5 5 l9 -10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
